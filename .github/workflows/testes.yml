name: Testes do navegador simulado

on:
  push:
    branches: [main, parte-2]
  pull_request:
    branches: [main, parte-2]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executar testes automatizados
        run: python -m unittest discover -s testes -v
